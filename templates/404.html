{% extends 'base.html' %}

{% block title %}404 - Page Not Found{% endblock %}
{% block page_title %}404 Not Found{% endblock %}

{% block content %}
<div class="text-center py-5">
  <div class="display-1 text-primary fw-bold mb-3">404</div>
  <h3 class="text-white mb-2">Page Not Found</h3>
  <p class="text-muted mb-4">The requested page or resource could not be found on this server.</p>
  <a href="{{ url_for('dashboard.dashboard_view') }}" class="btn btn-tech-primary">
    <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
  </a>
</div>
{% endblock %}
